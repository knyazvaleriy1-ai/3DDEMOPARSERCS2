[package]
name = "cs2wasm"
version = "0.1.0"
edition = "2021"
description = "demoparser2 (LaihoE/demoparser) compiled to WebAssembly for the in-browser CS2 demo parser"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Fetched and patched by build.sh (see DEMOPARSER_REV there).
parser = { path = "vendor/demoparser/src/parser" }
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
getrandom = { version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
ahash = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
